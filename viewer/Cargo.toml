[package]
name = "brep-conformance-viewer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The suite's exact shapes meshed for the report's viewer, built to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The suite and the protocol beside it only: the viewer must build outside this repository.
[dependencies]
brep-conformance = { path = "../suite" }
brep-protocol = { path = "../protocol" }
serde_json = "1"
