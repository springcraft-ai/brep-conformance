# SPDX-License-Identifier: MIT
name: C++ binding release

# Each release of the protocol, brep-protocol@<version>, carries every binding at that version: the
# Rust crate on crates.io, and the C++ binding as brep_protocol-<version>.tar.xz attached here,
# which adapters fetch by URL and pin by the SHA-256 the release's notes give. Publishing a
# protocol release attaches the C++ archive, packed from its tag. A run by hand attaches it to a
# release published without one, packed from the branch it runs on.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: The tag of the protocol release to attach the C++ binding to
        required: true
        default: brep-protocol-v1.0.0

permissions:
  contents: write

jobs:
  attach:
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name,
      'brep-protocol-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE: ${{ github.event.release.tag_name || inputs.release }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: The binding builds without a warning and its tests pass
        run: |
          cmake -S protocol/cpp -B protocol/cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build protocol/cpp/build
          ctest --test-dir protocol/cpp/build --output-on-failure
      - name: Pack the binding, at the release's version
        run: |
          out=$(python3 -I protocol/cpp/pack.py dist)
          archive=$(echo "$out" | sed -n 1p)
          hash=$(echo "$out" | sed -n 2p)
          version=${archive##*/brep_protocol-}
          version=${version%.tar.xz}
          if [ "$RELEASE" != "brep-protocol-v$version" ]; then
              echo "The release is $RELEASE, but protocol/cpp is at version $version."
              exit 1
          fi
          protocol/cpp/check-package.sh "$archive" "$hash"
          {
              echo "ARCHIVE=$archive"
              echo "HASH=$hash"
              echo "VERSION=$version"
          } >> "$GITHUB_ENV"
      - name: Attach the archive to the release, and its hash to the release's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"
          releases="https://github.com/$GITHUB_REPOSITORY/releases/download"
          url="$releases/$RELEASE/${ARCHIVE##*/}"
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          cat >> notes.md <<EOF

          ## C++

          The C++ binding at version $VERSION, packed from \`$GITHUB_SHA\`. An adapter's CMake
          build fetches it:

          \`\`\`cmake
          include(FetchContent)
          FetchContent_Declare(
              brep_protocol
              URL $url
              URL_HASH SHA256=$HASH
          )
          FetchContent_MakeAvailable(brep_protocol)
          \`\`\`

          SHA-256 of \`${ARCHIVE##*/}\`: \`$HASH\`
          EOF
          gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
