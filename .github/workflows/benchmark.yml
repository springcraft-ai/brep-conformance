# SPDX-License-Identifier: MIT
# Starts the benchmark machine, runs one session on it, terminates it, and publishes each kernel's
# shape files to the CDN: bench/README.md.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      suite_args:
        description: Arguments for every pass, such as --family booleans/overlap/boxes; empty for the
          whole suite
        type: string
        default: ''
      publish:
        description: Which CDN to publish the shape files to
        type: choice
        options: [dev, prod, none]
        default: dev
      nist:
        description: Run NIST's STEP files, as step/read-nist cases; untick to run without them
        type: boolean
        default: true
      fail_bench:
        description: Fail the bench job on purpose, to test that the machine still ends
        type: boolean
        default: false

# A job with no permissions block inherits these, so a job added later gets nothing by default.
permissions: {}

concurrency:
  group: benchmark
  cancel-in-progress: false

env:
  RUNNER_LABEL: benchmark-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  start:
    runs-on: ubuntu-24.04
    environment: benchmark
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # for AWS OIDC
    outputs:
      label: ${{ env.RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The runner carries one label, this run's. With a generic label such as self-hosted, any
      # workflow in the repository could ask for the machine while it is online.
      - name: Register a one-time runner
        id: runner
        env:
          APP_CLIENT_ID: ${{ vars.BENCHMARK_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BENCHMARK_APP_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          token=$(bench/app-token.sh)
          echo "::add-mask::$token"
          version=$(gh api repos/actions/runner/releases/latest --jq '.tag_name | ltrimstr("v")')
          reply=$(curl -sSf -X POST \
              -H "Authorization: Bearer $token" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners/generate-jitconfig" \
              -d "{\"name\":\"$RUNNER_LABEL\",\"runner_group_id\":1,\"work_folder\":\"_work\",
                   \"labels\":[\"$RUNNER_LABEL\"]}")
          jitconfig=$(jq -r .encoded_jit_config <<<"$reply")
          echo "::add-mask::$jitconfig"
          {
              echo '#!/bin/bash'
              printf 'RUNNER_VERSION=%q\nRUNNER_JITCONFIG=%q\n' "$version" "$jitconfig"
              tail -n +2 bench/first-boot.sh
          } > "$RUNNER_TEMP/user-data.sh"
          echo "runner $(jq -r .runner.id <<<"$reply"), version $version," \
              "user data $(wc -c < "$RUNNER_TEMP/user-data.sh") bytes of 16384"
          echo "id=$(jq -r .runner.id <<<"$reply")" >> "$GITHUB_OUTPUT"
          echo "$token" > "$RUNNER_TEMP/app-token"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.BENCHMARK_ROLE_ARN }}
          aws-region: ${{ vars.BENCHMARK_AWS_REGION }}
          mask-aws-account-id: true

      - name: Launch the machine
        id: launch
        env:
          TEMPLATE: ${{ vars.BENCHMARK_LAUNCH_TEMPLATE }}
          SUBNETS: ${{ secrets.BENCHMARK_SUBNET_IDS }}
        run: |
          tags="{Key=Application,Value=benchmark-runner},{Key=Name,Value=benchmark-runner}"
          tags="$tags,{Key=CostCenter,Value=springcraft-engineering}"
          tags="$tags,{Key=Environment,Value=production},{Key=GitHubRun,Value=$RUNNER_LABEL}"
          # GitHub masks a secret only as a whole, so each subnet is masked on its own.
          for subnet in ${SUBNETS//,/ }; do
              echo "::add-mask::$subnet"
          done
          instance=""
          for subnet in ${SUBNETS//,/ }; do
              if instance=$(aws ec2 run-instances \
                  --launch-template "LaunchTemplateName=$TEMPLATE,Version=\$Latest" \
                  --subnet-id "$subnet" --count 1 \
                  --user-data "file://$RUNNER_TEMP/user-data.sh" \
                  --tag-specifications "ResourceType=instance,Tags=[$tags]" \
                      "ResourceType=volume,Tags=[$tags]" \
                  --query 'Instances[0].InstanceId' --output text 2> "$RUNNER_TEMP/error"); then
                  break
              fi
              instance=""
              if ! grep -q -e InsufficientInstanceCapacity -e Unsupported "$RUNNER_TEMP/error"; then
                  cat "$RUNNER_TEMP/error"
                  exit 1
              fi
              echo "no capacity in $subnet; trying the next zone"
          done
          if [ -z "$instance" ]; then
              echo "no zone has capacity for this instance type"
              exit 1
          fi
          echo "::add-mask::$instance"
          echo "launched $instance"
          echo "instance=$instance" >> "$GITHUB_OUTPUT"

      # The machine configures itself, reboots, and only then starts the runner: about 10 minutes.
      - name: Wait for the runner to come online
        env:
          INSTANCE: ${{ steps.launch.outputs.instance }}
          RUNNER_ID: ${{ steps.runner.outputs.id }}
        run: |
          token=$(cat "$RUNNER_TEMP/app-token")
          for _ in $(seq 120); do
              status=$(curl -sS -H "Authorization: Bearer $token" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners/$RUNNER_ID" \
                  | jq -r '.status // "unknown"')
              if [ "$status" = online ]; then
                  echo "the runner is online"
                  exit 0
              fi
              state=$(aws ec2 describe-instances --instance-ids "$INSTANCE" \
                  --query 'Reservations[0].Instances[0].State.Name' --output text)
              if [ "$state" != pending ] && [ "$state" != running ]; then
                  echo "the machine is $state before its runner came online"
                  exit 1
              fi
              sleep 15
          done
          echo "the runner is not online after 30 minutes"
          exit 1

  # Runs on the machine, and runs kernel code. It declares no environment and has no identity
  # token, so nothing it starts can reach the App's key or take a role through GitHub. The machine
  # has one role of its own, which anything on it can use: it can put to the staging bucket and
  # nothing else.
  bench:
    needs: start
    runs-on: ${{ needs.start.outputs.label }}
    timeout-minutes: 420
    outputs:
      staged: ${{ steps.stage.outputs.prefix }}
    permissions:
      contents: read
    steps:
      - name: Check that this job cannot request an identity token
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "this job can request an identity token, and must not"
              exit 1
          fi

      - name: Record the machine
        run: |
          test -e /run/benchmark-runner/ready
          cat /etc/benchmark-runner/environment
          cp /etc/benchmark-runner/environment "$RUNNER_TEMP/environment.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: machine
          path: ${{ runner.temp }}/environment.txt

      - name: Fail on purpose
        if: inputs.fail_bench
        run: exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The toolchains, and each adapter at the commit kernels.json pins. Nothing here is timed.
      - name: Build the suite and the adapters
        env:
          BENCH_NIST: ${{ inputs.nist }}
        run: bench/setup.sh

      # The session's settings are fixed in bench/README.md: 24 workers, one isolated core each.
      - name: Run the session
        env:
          SUITE_ARGS: ${{ inputs.suite_args }}
          BENCH_NIST: ${{ inputs.nist }}
        run: |
          # shellcheck disable=SC2086
          bench/run-session.sh 24 $SUITE_ARGS

      # The machine's own role can put to the staging bucket and nothing else: it cannot read,
      # list or delete there, and it cannot reach the CDN. `cp` and not `sync`, which would list.
      # results/staged.txt lists exactly what was sent, and publish copies nothing else.
      - name: Send the shape files to staging
        id: stage
        if: inputs.publish != 'none'
        env:
          STAGING: ${{ secrets.BENCHMARK_STAGING_BUCKET }}
          AWS_DEFAULT_REGION: us-west-2
        run: |
          (cd assets && find . -type f \( -name '*.glb' -o -name '*.step' \) -printf '%P\n') \
              | LC_ALL=C sort > results/staged.txt
          if [ ! -s results/staged.txt ]; then
              echo "the session wrote no shape files"
              exit 1
          fi
          aws s3 cp assets "s3://$STAGING/$RUNNER_LABEL/" --recursive --no-follow-symlinks \
              --exclude '*' --include '*.glb' --include '*.step' --no-progress --only-show-errors
          echo "prefix=$RUNNER_LABEL" >> "$GITHUB_OUTPUT"
          echo "$(wc -l < results/staged.txt) files, $(du -sh assets | cut -f1), sent to staging"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results
          path: results
          if-no-files-found: ignore

  # Runs no kernel code. The upload roles trust this repository's main branch and v* tags with the
  # default token subject, so this job declares no environment.
  publish:
    needs: bench
    if: inputs.publish != 'none' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # for AWS OIDC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: results
          path: results
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.publish == 'prod' && secrets.BREP_CONFORMANCE_ASSET_ROLE || secrets.BREP_CONFORMANCE_ASSET_ROLE_DEV }}
          aws-region: us-west-2
          mask-aws-account-id: true
      # Under brep-conformance/<suite>/<kernel>/<version>/, the folder each report names as `assets`.
      # A file's name changes whenever what it shows does, so one already there is skipped, never
      # rewritten, and a second run copies nothing. The copy is from the staging bucket to the CDN's,
      # inside S3: nothing is downloaded here.
      - name: Publish the files the CDN lacks
        env:
          BUCKET: ${{ inputs.publish == 'prod' && secrets.BREP_CONFORMANCE_ASSET_BUCKET || secrets.BREP_CONFORMANCE_ASSET_BUCKET_DEV }}
          STAGING: ${{ secrets.BENCHMARK_STAGING_BUCKET }}
          # From bench, not this job's own label: a second attempt of this job alone has a new label.
          PREFIX: ${{ needs.bench.outputs.staged }}
        run: |
          set -o pipefail
          if [ -z "$PREFIX" ] || [ ! -s results/staged.txt ]; then
              echo "bench staged no shape files"
              exit 1
          fi
          # Staging must hold exactly what bench listed: nothing missing, and nothing put there by
          # anything else.
          aws s3api list-objects-v2 --bucket "$STAGING" --prefix "$PREFIX/" \
              --query 'Contents[].Key' --output text | tr '\t' '\n' \
              | sed "s|^$PREFIX/||" | LC_ALL=C sort > found.txt
          if ! diff <(LC_ALL=C sort results/staged.txt) found.txt > differences.txt; then
              echo "staging does not hold exactly what bench sent:"
              head -20 differences.txt
              exit 1
          fi
          immutable="public, max-age=31536000, immutable"
          for pass in springrep arris cadrs solidcore opencascade; do
              count=$(grep -c "^$pass/" results/staged.txt || true)
              # A kernel that can neither draw nor write STEP has no files.
              [ "$count" -gt 0 ] || continue
              folder=$(jq -r '"\(.suite)/\(.kernel.name)/\(.kernel.version)"' "results/$pass.json")
              if ! [[ "$folder" =~ ^[A-Za-z0-9._+-]+/[A-Za-z0-9._+-]+/[A-Za-z0-9._+-]+$ ]]; then
                  echo "$pass: $folder cannot name a folder"
                  exit 1
              fi
              # --copy-props none: the type and the cache lifetime are set here, and a copy of the
              # source's tags would need rights the upload role does not have.
              for kind in "glb model/gltf-binary" "step model/step"; do
                  read -r ext type <<<"$kind"
                  aws s3 sync "s3://$STAGING/$PREFIX/$pass/" "s3://$BUCKET/brep-conformance/$folder/" \
                      --size-only --exclude '*' --include "*.$ext" --copy-props none \
                      --content-type "$type" --cache-control "$immutable" \
                      --no-progress --only-show-errors
              done
              echo "$pass: $count files in brep-conformance/$folder/" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  stop:
    needs: [start, bench]
    if: always()
    runs-on: ubuntu-24.04
    environment: benchmark
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # for AWS OIDC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.BENCHMARK_ROLE_ARN }}
          aws-region: ${{ vars.BENCHMARK_AWS_REGION }}
          mask-aws-account-id: true

      # By tag and not by the start job's output: a start job cancelled after the launch has none.
      - name: Terminate the machine
        run: |
          instances=$(aws ec2 describe-instances \
              --filters "Name=tag:GitHubRun,Values=$RUNNER_LABEL" \
                  "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -z "$instances" ]; then
              echo "no machine is running for this run"
              exit 0
          fi
          for instance in $instances; do
              echo "::add-mask::$instance"
          done
          # shellcheck disable=SC2086
          aws ec2 terminate-instances --instance-ids $instances --output text
          # shellcheck disable=SC2086
          aws ec2 wait instance-terminated --instance-ids $instances
          echo "terminated $instances"

      # A runner that ran its job removes itself. One that never came online stays registered.
      - name: Remove the runner's registration
        if: always()
        env:
          APP_CLIENT_ID: ${{ vars.BENCHMARK_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BENCHMARK_APP_PRIVATE_KEY }}
        run: |
          token=$(bench/app-token.sh)
          echo "::add-mask::$token"
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners"
          id=$(curl -sSf -H "Authorization: Bearer $token" "$api?per_page=100" \
              | jq -r --arg name "$RUNNER_LABEL" '.runners[] | select(.name == $name) | .id')
          if [ -z "$id" ]; then
              echo "the runner is no longer registered"
              exit 0
          fi
          curl -sSf -X DELETE -H "Authorization: Bearer $token" "$api/$id"
          echo "removed runner $id"
