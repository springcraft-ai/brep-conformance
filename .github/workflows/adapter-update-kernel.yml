# SPDX-License-Identifier: MIT OR Apache-2.0
# One kernel's part of the Adapter update workflow, which runs this once for each kernel: finds the
# kernel's newer release, has Claude move the adapter to it, runs part of the suite on the result,
# and opens a pull request in the adapter's repository: bench/README.md.
name: Adapter update, one kernel

on:
  workflow_call:
    inputs:
      kernel:
        type: string
        required: true
      version:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false

# A job with no permissions block inherits these, so a job added later gets nothing by default.
permissions: {}

env:
  KERNEL: ${{ inputs.kernel }}
  THREADS: 4

jobs:
  # Builds nothing and runs no kernel code: reads the adapter's pins and asks crates.io, GitHub or
  # conda-forge for the release to move to, so an adapter at its newest costs a minute.
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      moved: ${{ steps.target.outputs.moved }}
      to: ${{ steps.target.outputs.to }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: suite
          persist-credentials: false
      - name: Find the release to move to
        id: target
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }} # read-only, for GitHub's API without its shared limit
        run: |
          mkdir work
          python3 -I suite/bench/adapter_update.py plan suite "$KERNEL" > work/where.json
          git clone -q "$(jq -r .repo work/where.json)" adapter
          python3 -I suite/bench/adapter_update.py target adapter "$VERSION" > work/target.json
          jq -s --arg commit "$(git -C adapter rev-parse HEAD)" '.[0] + .[1] + {commit: $commit}' \
              work/where.json work/target.json > work/plan.json
          from=$(jq -r .from work/plan.json)
          to=$(jq -r .to work/plan.json)
          echo "to=$to" >> "$GITHUB_OUTPUT"
          if [ "$from" = "$to" ]; then
              echo "The adapter is at $KERNEL $to already" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "moved=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "$KERNEL $from → $to: $(jq -c '.pins | map_values({from, to})' work/plan.json)" \
              >> "$GITHUB_STEP_SUMMARY"
          jq -r '.licence_changed[]
              | "::warning::the licence of \(.name) changed from \(.from) to \(.to)"' work/plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.target.outputs.moved == 'true'
        with:
          name: plan-${{ inputs.kernel }}
          path: work/plan.json

  # Claude runs kernel code: it holds no GitHub token that can write, and its Claude access is a
  # short-lived token for one workspace, which the adapter-claude environment's rule grants only to
  # this job on main.
  update:
    needs: target
    if: needs.target.outputs.moved == 'true'
    runs-on: ubuntu-24.04
    environment: adapter-claude
    # The builds, Claude's 90 minutes, and the run on the smoke families and Claude's.
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write # for the Claude API's workload identity federation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: suite
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plan-${{ inputs.kernel }}
          path: work
      - name: Check out the adapter, and both releases' sources
        id: plan
        run: |
          git clone -q "$(jq -r .repo work/plan.json)" adapter
          git -C adapter checkout -q "$(jq -r .commit work/plan.json)"
          echo "binary=$(jq -r .binary work/plan.json)" >> "$GITHUB_OUTPUT"
          jq --arg k "$KERNEL" '.kernels[] | select(.kernel == $k)' suite/kernels.json \
              > work/kernel.json
          mkdir -p work/old work/new
          # A crate from crates.io as published there, one from git as its two releases' commits.
          # A package from conda-forge is a build of a kernel whose source is too big to unpack
          # whole: kernel.json names its repository, for Claude to compare the releases' tags there.
          jq -r '.pins | to_entries[] | .value as $v | select($v.source != "conda-forge")
              | if $v.source == "git" then "\(.key) \($v.repository) \($v.from_commit) \($v.to_commit)"
                else "\(.key) - \($v.from) \($v.to)" end' work/plan.json \
              | while read -r crate repository from to; do
                  if [ "$repository" = - ]; then
                      crates=https://static.crates.io/crates/$crate
                      curl -sSfL "$crates/$crate-$from.crate" | tar xz -C work/old
                      curl -sSfL "$crates/$crate-$to.crate" | tar xz -C work/new
                  else
                      tarballs=https://codeload.github.com/${repository#https://github.com/}/tar.gz
                      curl -sSfL "$tarballs/$from" | tar xz -C work/old
                      curl -sSfL "$tarballs/$to" | tar xz -C work/new
                  fi
              done
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: suite -> target
      # An adapter its own build.sh makes, with no cargo workspace, has nothing for this to keep.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: hashFiles('adapter/Cargo.lock') != ''
        with:
          workspaces: adapter -> target
          key: adapter
      - name: Build the suite
        run: |
          suite/bench/adapter-build-deps.sh
          cd suite && cargo build --release --locked -p brep-conformance

      # A run that stops short, at its turn limit say, still proposes what it did, as a draft.
      - uses: anthropics/claude-code-action/base-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        id: claude
        continue-on-error: true
        timeout-minutes: 90
        with:
          prompt_file: suite/bench/adapter-update-prompt.md
          claude_args: >-
            --model opus --max-turns 300
            --allowedTools Bash,Read,Edit,Write,Glob,Grep
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

      # The action hides Claude's output, so without this a run the API refuses shows no reason.
      - name: Say why Claude stopped
        if: steps.claude.outcome != 'success'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ ! -f "$EXECUTION_FILE" ]; then
              echo "Claude left no output file"
              exit 0
          fi
          {
              printf '## Claude stopped\n\n```\n'
              jq -rs '.. | objects | select(.type? == "result")
                  | "\(.subtype) after \(.num_turns) turns", (.result // empty),
                      (.errors[]? | tostring)' \
                  "$EXECUTION_FILE"
              printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The pull request carries what this step measures, not what Claude says it measured.
      - name: Check Claude's change and run the suite on it
        env:
          BINARY: ${{ steps.plan.outputs.binary }}
          CLAUDE: ${{ steps.claude.outcome }}
        run: |
          rm -rf work/old work/new
          if [ "$CLAUDE" != success ]; then
              printf '\n## Not done\n\nClaude stopped before it finished; see the run.\n' \
                  >> work/report.md
          fi
          git -C adapter add -A
          # Claude may change the adapter's source, build files, README and manifests, and no more.
          bad=$(git -C adapter diff --cached --name-only | grep -vE \
              '^(src/.*|[^/]+\.(rs|cpp|h|hpp)|Cargo\.toml|Cargo\.lock|CMakeLists\.txt|build\.sh|README\.md)$' \
              || true)
          if [ -n "$bad" ]; then
              echo "::error::Claude changed files it may not: $bad"
              exit 1
          fi
          git -C adapter diff --cached --binary > work/final.patch
          if ! python3 -I suite/bench/adapter_update.py check adapter work/plan.json \
              > work/pins.txt 2>&1; then
              echo "::warning::the adapter does not pin the release: $(cat work/pins.txt)"
          else
              rm work/pins.txt
          fi
          # The smoke families, and each family Claude says it changed, as a family's name.
          touch work/families.txt
          families=$( { sed -n 's/^--family //p' suite/bench/smoke.txt | tr , '\n'
              grep -E '^[a-z0-9][a-z0-9/_-]*$' work/families.txt || true
              } | sort -u | paste -sd, - )
          echo "Families: $families" >> "$GITHUB_STEP_SUMMARY"
          if suite/bench/adapter-build.sh adapter work/plan.json; then
              suite/target/release/brep-conformance --adapter "adapter/$BINARY" \
                  --threads "$THREADS" --family "$families" \
                  --out work/final.json > work/final.txt
              python3 -I suite/bench/adapter_update.py summary work/final.json > work/results.md
              cat work/results.md >> "$GITHUB_STEP_SUMMARY"
          else
              echo "The adapter does not build after Claude's change" \
                  | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "$families" > work/families-run.txt
          [ -f work/report.md ] && cat work/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: update-${{ inputs.kernel }}
          path: |
            work
            !work/old
            !work/new

  # Runs no kernel code: it applies the change, and opens the pull request with the App's token.
  propose:
    needs: [target, update]
    if: >-
      always() && !inputs.dry_run && needs.target.outputs.moved == 'true'
      && needs.update.result == 'success'
    runs-on: ubuntu-24.04
    environment: adapter-update
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: suite
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-${{ inputs.kernel }}
          path: work
      - name: Open the pull request
        env:
          APP_CLIENT_ID: ${{ vars.ADAPTER_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ADAPTER_APP_PRIVATE_KEY }}
          TO: ${{ needs.target.outputs.to }}
        run: |
          repo=$(jq -r .repo work/plan.json)
          slug=${repo#https://github.com/}
          token=$(suite/bench/app-token.sh '{"contents": "write", "pull_requests": "write"}' \
              "$slug")
          echo "::add-mask::$token"
          branch="kernel/$TO"
          git clone -q "https://x-access-token:$token@github.com/$slug.git" adapter
          # Claude's change is to the commit target read, which main may have moved past since.
          git -C adapter checkout -q "$(jq -r .commit work/plan.json)"
          # A branch this workflow left, one commit on main by the bot, is replaced on a re-run;
          # one anybody else has pushed to is not.
          if git -C adapter fetch -q origin "$branch" 2> /dev/null; then
              ahead=$(git -C adapter rev-list --count origin/main..FETCH_HEAD)
              authors=$(git -C adapter log --format=%ae origin/main..FETCH_HEAD | sort -u)
              if [ "$ahead" != 1 ] \
                  || [ "$authors" != "41898282+github-actions[bot]@users.noreply.github.com" ]; then
                  echo "::error::$slug has a branch $branch with commits of its own"
                  exit 1
              fi
          fi
          if [ ! -s work/final.patch ]; then
              echo "::error::Claude changed nothing in the adapter"
              exit 1
          fi
          git -C adapter apply --binary ../work/final.patch

          from=$(jq -r .from work/plan.json)
          pins=$(jq -r '.pins | keys | map("`\(.)`") | join(", ")' work/plan.json)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          draft=()
          if [ ! -f work/final.json ] || [ -f work/pins.txt ] \
              || [ "$(jq -r .kernel.version work/final.json)" != "$TO" ] \
              || [ "$(jq '.licence_changed | length' work/plan.json)" != 0 ] \
              || { [ -f work/report.md ] && grep -q '^## Not done' work/report.md; }; then
              draft=(--draft)
          fi
          {
              echo "Moves $KERNEL from $from to $TO: $pins, pinned exactly."
              echo
              jq -r 'if (.licence_changed | length) > 0 then "## Licence changed\n\n"
                  + (.licence_changed | map("- `\(.name)`: \(.from) → \(.to)") | join("\n"))
                  + "\n\nA person decides whether the suite can still score it.\n" else empty end' \
                  work/plan.json
              if [ -f work/report.md ]; then
                  cat work/report.md
              else
                  echo "## Not done"
                  echo
                  echo "Claude left no report; see the run."
              fi
              echo
              echo "## Results"
              echo
              if [ -f work/final.json ]; then
                  echo "The suite at springcraft-ai/brep-conformance@${GITHUB_SHA::7}, on the" \
                      "families \`$(cat work/families-run.txt)\`:"
                  echo
                  cat work/results.md
              else
                  echo "The adapter does not build at $TO, so nothing was run."
              fi
              echo
              echo "## Test plan"
              echo
              if [ -f work/pins.txt ]; then
                  echo "- [ ] Pins $TO: $(paste -sd';' work/pins.txt)"
              else
                  echo "- [x] Pins $TO exactly"
              fi
              if [ -f work/final.json ]; then
                  echo "- [x] Builds at $TO with the commands \`kernels.json\` gives it"
                  echo "- [x] Reports $KERNEL $(jq -r .kernel.version work/final.json)"
                  echo "- [x] The families above: the table"
              else
                  echo "- [ ] Builds at $TO"
              fi
              echo "- [ ] Each change is pass-through, as the contract asks"
              echo
              echo "Opened by the [Adapter update]($run) workflow."
          } > "$RUNNER_TEMP/body.md"

          title="Take $KERNEL $TO"
          git -C adapter config user.name "github-actions[bot]"
          git -C adapter config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C adapter switch -q -C "$branch"
          git -C adapter add -A
          git -C adapter commit -q -m "$title"
          git -C adapter push -q --force origin "$branch"
          if url=$(GH_TOKEN=$token gh pr view "$branch" --repo "$slug" --json url,state \
              --jq 'select(.state == "OPEN") | .url' 2> /dev/null) && [ -n "$url" ]; then
              GH_TOKEN=$token gh pr edit "$url" --title "$title" --body-file "$RUNNER_TEMP/body.md"
              if [ "${#draft[@]}" -gt 0 ]; then
                  GH_TOKEN=$token gh pr ready "$url" --undo > /dev/null 2>&1 || true
              else
                  GH_TOKEN=$token gh pr ready "$url" > /dev/null 2>&1 || true
              fi
              echo "Updated $url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
              GH_TOKEN=$token gh pr create --repo "$slug" --base main --head "$branch" \
                  "${draft[@]}" --title "$title" --body-file "$RUNNER_TEMP/body.md" \
                  | tee -a "$GITHUB_STEP_SUMMARY"
          fi
