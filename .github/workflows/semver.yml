# SPDX-License-Identifier: MIT
name: Semver

# brep-protocol's version is raised when a release is cut, not in each pull request. A pull request
# that leaves the version as published is told the least release its changes need, and never
# fails; one that raises the version must raise it enough.
on:
  pull_request:
    paths: [protocol/**]

permissions:
  contents: read

env:
  SEMVER_CHECKS_VERSION: 0.51.0

jobs:
  brep-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-semver-checks
        run: cargo install --locked cargo-semver-checks --version "$SEMVER_CHECKS_VERSION"
      - name: Check against the published release
        run: |
          published="$(cargo search brep-protocol --limit 1 \
              | sed -n 's/^brep-protocol = "\([^"]*\)".*/\1/p')"
          current="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "brep-protocol") | .version')"
          if [ "$current" != "$published" ]; then
              echo "brep-protocol $published is published; this pull request makes it $current." \
                  >> "$GITHUB_STEP_SUMMARY"
              cargo semver-checks -p brep-protocol
              exit
          fi
          : > previous.txt
          for kind in patch minor major; do
              if cargo semver-checks -p brep-protocol --release-type "$kind" > report.txt 2>&1; then
                  {
                      echo "brep-protocol: these changes need a $kind release after $published."
                      if [ -s previous.txt ]; then
                          echo '```'
                          grep -E '^--- failure|^  [a-z]' previous.txt | sed "s#$PWD/##" || true
                          echo '```'
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi
              mv report.txt previous.txt
          done
          # Every release type refused: the check itself did not run.
          cat previous.txt
          exit 1
