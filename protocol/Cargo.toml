[package]
name = "brep-protocol"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "The B-rep operations a conformance suite calls: their data types, the kernel trait, and its JSON-lines binding"
publish = true
readme = "README.md"
repository = "https://github.com/springcraft-ai/brep-conformance"
documentation = "https://docs.rs/brep-protocol"
keywords = ["brep", "cad", "geometry", "kernel", "conformance"]

# crates.io dependencies only: the protocol must build outside this repository.
[dependencies]
serde_json = "1"
# One maths library everywhere, so the same seed draws the same cases on every platform.
libm = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
